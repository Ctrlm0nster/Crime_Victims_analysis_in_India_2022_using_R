name: R analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-plot:
    runs-on: ubuntu-24.04
    container: rocker/r-ver:4.6.2
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config git curl libuv1-dev libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev libcairo2-dev libpng-dev fonts-dejavu-core
      - name: Cache pinned R packages
        uses: actions/cache@v5
        with:
          path: renv/library
          key: r-analysis-${{ runner.os }}-4.6.2-source-${{ hashFiles('renv.lock') }}
          restore-keys: r-analysis-${{ runner.os }}-4.6.2-source-
      - name: Cache Quarto CLI
        id: quarto-cache
        uses: actions/cache@v5
        with:
          path: .tools/quarto
          key: quarto-${{ runner.os }}-1.11.9
      - name: Install Quarto CLI
        if: steps.quarto-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools/quarto
          curl -fsSL https://github.com/quarto-dev/quarto-cli/releases/download/v1.11.9/quarto-1.11.9-linux-amd64.tar.gz | tar -xz -C .tools/quarto --strip-components=1
      - name: Install renv
        run: Rscript -e 'install.packages("renv", repos = "https://cloud.r-project.org")'
      - name: Generate results and run every offline check
        run: |
          cp README.md /tmp/ncrb-committed-readme.md
          rm -rf Result/CSV
          set +e
          Rscript run.R --restore --report > /tmp/ncrb-analysis.log 2>&1
          result=$?
          cat /tmp/ncrb-analysis.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYTHON'
          from pathlib import Path
          lines = Path('/tmp/ncrb-analysis.log').read_text().splitlines()
          details = '\n'.join(lines[-120:])[-12000:]
          details = details.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=R workflow diagnostics::' + details)
          PYTHON
          fi
          exit "$result"
      - name: Check rendered README
        run: |
          Rscript Scripts/Render_README.R --check
          cmp /tmp/ncrb-committed-readme.md README.md
      - name: Upload generated charts, reports, and data
        uses: actions/upload-artifact@v4
        with:
          name: ncrb-analysis-results
          path: |
            Result/CSV/
            Result/report/
          if-no-files-found: error
          retention-days: 14
